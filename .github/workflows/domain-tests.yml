name: Tes Domain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kompilasi dan tes modul domain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Kompilasi dan jalankan tes domain
        run: gradle :domain:test --stacktrace

      - name: Ringkasan hasil tes
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = s = 0
          for p in glob.glob("domain/build/test-results/test/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0))
              f += int(r.get("failures", 0)) + int(r.get("errors", 0))
              s += int(r.get("skipped", 0))
          print("## Hasil tes modul domain")
          print(f"- Total tes: {t}")
          print(f"- Gagal: {f}")
          print(f"- Dilewati: {s}")
          if t == 0:
              print("- PERHATIAN: tidak ada hasil tes. Kemungkinan kompilasi gagal; lihat langkah sebelumnya.")
          PY

      - name: Unggah laporan tes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes-domain
          path: domain/build/reports/tests/test
          if-no-files-found: warn
