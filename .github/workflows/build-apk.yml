name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tes, build APK debug, dan lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Ambil kode
        uses: actions/checkout@v6

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Tes domain dan build APK debug
        shell: bash
        run: |
          set -o pipefail
          gradle :domain:test :app:assembleDebug --continue --stacktrace 2>&1 | tee build.log

      - name: Lint (laporan saja, tidak menggagalkan build)
        continue-on-error: true
        shell: bash
        run: gradle :app:lintDebug --stacktrace

      - name: Ringkasan hasil
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET
          t = f = s = 0
          for p in glob.glob("domain/build/test-results/test/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0))
              f += int(r.get("failures", 0)) + int(r.get("errors", 0))
              s += int(r.get("skipped", 0))
          print("## Hasil build")
          print(f"- Tes domain: {t} total, {f} gagal, {s} dilewati")
          apks = glob.glob("app/build/outputs/apk/debug/*.apk")
          if apks:
              size = os.path.getsize(apks[0]) / 1e6
              print(f"- APK debug: {os.path.basename(apks[0])} ({size:.1f} MB). Unduh dari bagian Artifacts di bawah.")
          else:
              print("- APK debug: TIDAK terbentuk")
              if os.path.exists("build.log"):
                  lines = open("build.log", errors="replace").read().splitlines()
                  errs = [l for l in lines if l.startswith("e: ") or "error:" in l.lower()]
                  for i, l in enumerate(lines):
                      if l.startswith("* What went wrong"):
                          errs += lines[i:i + 8]
                  print("### Pesan error (kirim screenshot bagian ini)")
                  print("```")
                  print("\n".join(errs[:40]) if errs else "(tidak ada pesan error terdeteksi, lihat log lengkap)")
                  print("```")
          PY

      - name: Unggah APK debug
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: jasmani-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unggah laporan tes dan lint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: laporan-tes-dan-lint
          path: |
            domain/build/reports/tests/test
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
